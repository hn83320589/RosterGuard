name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-test-publish:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore RosterGuard.sln

      - name: Build
        run: dotnet build RosterGuard.sln -c Release --no-restore

      - name: Test
        run: dotnet test RosterGuard.sln -c Release --no-build --logger "trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

      - name: Publish win-x64
        run: >
          dotnet publish src/RosterGuard.App/RosterGuard.App.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/win-x64

      - name: Upload win-x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: RosterGuard-win-x64
          path: publish/win-x64
